<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare - Project Validator AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="./assets/css/output.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen">
  
  <nav class="glass sticky top-0 z-50 w-full px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="ph ph-rocket-launch text-3xl text-primary-500"></i>
        <a href="index.html" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Project Validator AI</a>
      </div>
      <div class="hidden md:flex items-center gap-8">
        <a href="index.html" class="nav-link">Home</a>
        <a href="analyze.html" class="nav-link">Analyze</a>
        <a href="saved.html" class="nav-link">Saved Projects</a>
        <a href="compare.html" class="nav-link active">Compare</a>
      </div>
      <button id="mobileMenuBtn" class="md:hidden text-slate-300">
        <i class="ph ph-list text-2xl"></i>
      </button>
    </div>
  </nav>

  <main class="flex-grow flex flex-col items-center py-12 px-4 relative overflow-hidden">
    <div class="absolute top-1/2 right-10 w-96 h-96 bg-primary-600/15 rounded-full blur-[120px] -z-10 animate-drift pointer-events-none -translate-y-1/2"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-accent-500/10 rounded-full blur-[100px] -z-10 animate-spin-slow pointer-events-none"></div>

    <div class="max-w-6xl w-full relative z-10">
      <h1 class="text-3xl font-bold text-white flex items-center gap-3 mb-6">
        <i class="ph-fill ph-scales text-primary-500"></i>
        Compare Projects
      </h1>

      <div class="glass-card p-6 mb-8 flex flex-col md:flex-row gap-4 items-end">
        <div class="flex-1 w-full">
          <label class="label-text">Project A</label>
          <select id="selectA" class="input-field w-full">
            <option value="">Select a project...</option>
          </select>
        </div>
        <div class="flex items-center justify-center p-2 hidden md:block text-slate-500 font-bold">VS</div>
        <div class="flex-1 w-full">
          <label class="label-text">Project B</label>
          <select id="selectB" class="input-field w-full">
            <option value="">Select a project...</option>
          </select>
        </div>
        <button id="compareBtn" class="btn-primary w-full md:w-auto">Compare</button>
      </div>

      <div id="compareResults" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Summary Cards -->
        <div class="glass-card p-6 flex flex-col justify-center items-center text-center">
          <h3 id="nameA" class="text-xl font-bold text-primary-400 mb-2">Project A</h3>
          <p id="scoreA" class="text-4xl font-black text-white mb-1">0</p>
          <p id="verdictA" class="text-sm font-bold text-slate-400 uppercase">VERDICT</p>
        </div>

        <div class="glass-card p-6 h-[300px] lg:h-auto flex items-center justify-center">
           <canvas id="compareRadar"></canvas>
        </div>

        <div class="glass-card p-6 flex flex-col justify-center items-center text-center">
          <h3 id="nameB" class="text-xl font-bold text-accent-400 mb-2">Project B</h3>
          <p id="scoreB" class="text-4xl font-black text-white mb-1">0</p>
          <p id="verdictB" class="text-sm font-bold text-slate-400 uppercase">VERDICT</p>
        </div>

        <!-- Detail Table -->
        <div class="md:col-span-2 lg:col-span-3 glass-card overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-800/50 border-b border-slate-700">
                <th class="p-4 text-slate-400 font-medium">Metric</th>
                <th class="p-4 text-primary-400 font-medium w-2/5" id="thA">Project A</th>
                <th class="p-4 text-accent-400 font-medium w-2/5" id="thB">Project B</th>
              </tr>
            </thead>
            <tbody id="compareTableBody" class="text-sm text-slate-300">
              <!-- Injected by JS -->
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <script src="./assets/js/storage.js"></script>
  <script src="./assets/js/main.js"></script>
  <script>
    let compareChart = null;

    document.addEventListener('DOMContentLoaded', () => {
      const projects = window.StorageAPI.getProjects();
      const selectA = document.getElementById('selectA');
      const selectB = document.getElementById('selectB');

      projects.forEach(p => {
        selectA.add(new Option(p.name, p.id));
        selectB.add(new Option(p.name, p.id));
      });

      document.getElementById('compareBtn').addEventListener('click', () => {
        const idA = selectA.value;
        const idB = selectB.value;

        if (!idA || !idB || idA === idB) {
          alert('Please select two distinct projects to compare.');
          return;
        }

        const pA = window.StorageAPI.getProjectById(idA);
        const pB = window.StorageAPI.getProjectById(idB);

        renderComparison(pA, pB);
      });
    });

    function renderComparison(pA, pB) {
      document.getElementById('compareResults').classList.remove('hidden');

      // Update Headers
      document.getElementById('nameA').textContent = pA.name;
      document.getElementById('scoreA').textContent = pA.totalScore;
      document.getElementById('verdictA').textContent = pA.verdict;
      document.getElementById('thA').textContent = pA.name;

      document.getElementById('nameB').textContent = pB.name;
      document.getElementById('scoreB').textContent = pB.totalScore;
      document.getElementById('verdictB').textContent = pB.verdict;
      document.getElementById('thB').textContent = pB.name;

      // Render Table
      const tbody = document.getElementById('compareTableBody');
      tbody.innerHTML = '';
      
      const metricsToCompare = [
        { label: 'Type', key: 'type' },
        { label: 'Tier', key: 'tier' },
        { label: 'Idea', key: 'oneLineIdea' },
        { label: 'Deployment', key: 'deployment' },
        { label: 'Tech / AI', key: 'aiIntegration' },
      ];

      metricsToCompare.forEach(m => {
        tbody.innerHTML += `
          <tr class="border-b border-slate-700/50 hover:bg-slate-800/30 transition-colors">
            <td class="p-4 font-medium text-slate-400">${m.label}</td>
            <td class="p-4">${pA[m.key] || '--'}</td>
            <td class="p-4">${pB[m.key] || '--'}</td>
          </tr>
        `;
      });

      // Render Radar Chart
      const ctx = document.getElementById('compareRadar').getContext('2d');
      Chart.defaults.color = '#94a3b8';
      Chart.defaults.font.family = 'Inter';

      if (compareChart) {
        compareChart.destroy();
      }

      compareChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['Technical', 'Career', 'Viability', 'Interest', 'AI'],
          datasets: [
            {
              label: pA.name,
              data: [pA.metrics.technical, pA.metrics.career, pA.metrics.viability, pA.metrics.interest, pA.metrics.ai],
              backgroundColor: 'rgba(139, 92, 246, 0.2)', // primary
              borderColor: '#8b5cf6',
              pointBackgroundColor: '#8b5cf6',
              borderWidth: 2,
            },
            {
              label: pB.name,
              data: [pB.metrics.technical, pB.metrics.career, pB.metrics.viability, pB.metrics.interest, pB.metrics.ai],
              backgroundColor: 'rgba(14, 165, 233, 0.2)', // accent (sky)
              borderColor: '#0ea5e9',
              pointBackgroundColor: '#0ea5e9',
              borderWidth: 2,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
              grid: { color: 'rgba(255, 255, 255, 0.1)' },
              pointLabels: { font: { size: 10 }, color: '#cbd5e1' },
              ticks: { display: false, min: 0, max: 10 }
            }
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#e2e8f0', usePointStyle: true, boxWidth: 8 }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
