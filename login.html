<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Project Validator AI</title>
  <meta name="description" content="Sign in to Project Validator AI — your intelligent project decision platform.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="./assets/css/output.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen items-center justify-center relative overflow-hidden">

  <!-- Background Glows -->
  <div class="absolute top-0 left-1/4 w-[600px] h-[600px] bg-primary-600/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
  <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-accent-500/10 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

  <!-- Logo -->
  <a href="index.html" class="flex items-center gap-2 mb-8">
    <i class="ph ph-rocket-launch text-3xl text-primary-500"></i>
    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Project Validator AI</span>
  </a>

  <!-- Card -->
  <div class="glass-card p-8 w-full max-w-md mx-4">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      <p class="text-slate-400 text-sm mt-2">Sign in to access your project dashboard</p>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden mb-5 p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl flex items-center gap-2 text-rose-400 text-sm">
      <i class="ph ph-warning-circle text-lg flex-shrink-0"></i>
      <span id="errorMessage">Invalid credentials.</span>
    </div>

    <!-- Google OAuth -->
    <button id="googleBtn" class="btn-secondary w-full mb-5 py-3 gap-3 relative group">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
      <span id="googleSpinner" class="hidden absolute right-4 top-1/2 -translate-y-1/2">
        <i class="ph ph-spinner animate-spin text-lg"></i>
      </span>
    </button>

    <!-- Divider -->
    <div class="flex items-center gap-4 mb-5">
      <div class="flex-1 h-px bg-white/10"></div>
      <span class="text-slate-500 text-xs">or continue with email</span>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>

    <!-- Email Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="label-text" for="email">Email address</label>
        <div class="relative">
          <i class="ph ph-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="email" id="email" required autocomplete="email"
                 class="input-field pl-10" placeholder="you@example.com">
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="label-text mb-0" for="password">Password</label>
          <a href="#" class="text-xs text-primary-400 hover:text-primary-300 transition-colors">Forgot password?</a>
        </div>
        <div class="relative">
          <i class="ph ph-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="password" id="password" required autocomplete="current-password"
                 class="input-field pl-10 pr-10" placeholder="••••••••">
          <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
            <i class="ph ph-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-primary w-full py-3 mt-2">
        <i class="ph ph-sign-in text-lg"></i>
        Sign In
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Don't have an account?
      <a href="signup.html" class="text-primary-400 hover:text-primary-300 font-medium transition-colors">Create one free</a>
    </p>
  </div>

  <p class="text-slate-600 text-xs mt-8 text-center max-w-sm mx-4">
    By signing in you agree to use this platform responsibly. Your data is stored securely in Supabase.
  </p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabaseClient.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Redirect if already logged in
      await window.AuthAPI.redirectIfLoggedIn('saved.html');

      const form         = document.getElementById('loginForm');
      const submitBtn    = document.getElementById('submitBtn');
      const googleBtn    = document.getElementById('googleBtn');
      const errorBanner  = document.getElementById('errorBanner');
      const errorMessage = document.getElementById('errorMessage');
      const togglePwd    = document.getElementById('togglePassword');
      const eyeIcon      = document.getElementById('eyeIcon');
      const pwdInput     = document.getElementById('password');

      function showError(msg) {
        errorMessage.textContent = msg;
        errorBanner.classList.remove('hidden');
      }
      function hideError() {
        errorBanner.classList.add('hidden');
      }

      // Toggle password visibility
      togglePwd.addEventListener('click', () => {
        const isText = pwdInput.type === 'text';
        pwdInput.type = isText ? 'password' : 'text';
        eyeIcon.className = isText ? 'ph ph-eye' : 'ph ph-eye-slash';
      });

      // Email sign in
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Signing in...';

        try {
          await window.AuthAPI.signInWithEmail(
            document.getElementById('email').value.trim(),
            document.getElementById('password').value
          );
          window.location.href = 'saved.html';
        } catch (err) {
          showError(err.message || 'Invalid email or password.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="ph ph-sign-in text-lg"></i> Sign In';
        }
      });

      // Google sign in
      googleBtn.addEventListener('click', async () => {
        document.getElementById('googleSpinner').classList.remove('hidden');
        googleBtn.disabled = true;
        try {
          await window.AuthAPI.signInWithGoogle();
        } catch (err) {
          showError(err.message || 'Google sign in failed.');
          document.getElementById('googleSpinner').classList.add('hidden');
          googleBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
