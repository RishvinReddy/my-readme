<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Projects - Project Validator AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="./assets/css/output.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen">
  
  <nav class="glass sticky top-0 z-50 w-full px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="ph ph-rocket-launch text-3xl text-primary-500"></i>
        <a href="index.html" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Project Validator AI</a>
      </div>
      <div class="hidden md:flex items-center gap-8">
        <a href="index.html" class="nav-link">Home</a>
        <a href="analyze.html" class="nav-link">Analyze</a>
        <a href="saved.html" class="nav-link active">Saved Projects</a>
        <a href="compare.html" class="nav-link">Compare</a>
      </div>
      <button id="mobileMenuBtn" class="md:hidden text-slate-300">
        <i class="ph ph-list text-2xl"></i>
      </button>
    </div>
  </nav>

  <main class="flex-grow flex flex-col items-center py-12 px-4 relative overflow-hidden">
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary-600/15 rounded-full blur-[150px] -z-10 animate-drift pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-accent-500/10 rounded-full blur-[100px] -z-10 animate-spin-slow pointer-events-none"></div>

    <div class="max-w-6xl w-full relative z-10">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-6 gap-4">
        <div>
          <h1 class="text-3xl font-bold text-white flex items-center gap-3">
            <i class="ph-fill ph-folder-open text-primary-500"></i>
            Saved Projects
          </h1>
          <p class="text-slate-400 mt-2">View and manage your evaluated ideas.</p>
        </div>
        <div class="flex gap-3 w-full sm:w-auto">
          <button id="exportBtn" class="btn-secondary py-2 px-4 whitespace-nowrap">
            <i class="ph ph-download-simple"></i> Export Data
          </button>
          <label class="btn-secondary py-2 px-4 whitespace-nowrap cursor-pointer">
            <i class="ph ph-upload-simple"></i> Import Data
            <input type="file" id="importFile" class="hidden" accept=".json">
          </label>
          <a href="analyze.html" class="btn-primary py-2 px-4 whitespace-nowrap">
            <i class="ph ph-plus"></i> New Idea
          </a>
        </div>
      </div>

      <!-- Controls -->
      <div class="glass-card p-4 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="relative w-full md:max-w-md">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="Search projects by name..." class="input-field pl-10 w-full">
        </div>
        <div class="flex gap-4 w-full md:w-auto">
          <select id="filterTier" class="input-field w-full md:w-48">
            <option value="All">All Tiers</option>
            <option value="Tier 4/5">Tier 4/5 (Build Now)</option>
            <option value="Tier 3">Tier 3 (Strong)</option>
            <option value="Tier 2">Tier 2 (Good)</option>
            <option value="Tier 1">Tier 1 (Experimental)</option>
          </select>
        </div>
      </div>

      <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Injected by JS -->
      </div>
      
      <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
        <i class="ph ph-ghost text-6xl text-slate-600 mb-4"></i>
        <h3 class="text-xl font-bold text-slate-300">No projects found</h3>
        <p class="text-slate-500 mt-2 max-w-sm">You haven't analyzed any projects yet. Go ahead and evaluate your first idea!</p>
        <a href="analyze.html" class="btn-secondary mt-6">Start Analyzing</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabaseClient.js"></script>
  <script src="./assets/js/storage.js"></script>
  <script src="./assets/js/main.js"></script>
  <script>
    let allProjects = [];

    document.addEventListener('DOMContentLoaded', async () => {
      // Show loading state
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = '<p class="col-span-3 text-center text-slate-500 py-16">Loading projects from cloud...</p>';

      allProjects = await window.StorageAPI.getProjects();
      renderProjects();

      // Search & Filter listeners
      document.getElementById('searchInput').addEventListener('input', renderProjects);
      document.getElementById('filterTier').addEventListener('change', renderProjects);

      // Export/Import listeners
      document.getElementById('exportBtn').addEventListener('click', handleExport);
      document.getElementById('importFile').addEventListener('change', handleImport);
    });

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      const emptyState = document.getElementById('emptyState');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filterTier = document.getElementById('filterTier').value;

      grid.innerHTML = '';

      const filteredProjects = allProjects.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(searchTerm) || p.oneLineIdea.toLowerCase().includes(searchTerm);
        const matchesTier = filterTier === 'All' || p.tier === filterTier;
        return matchesSearch && matchesTier;
      });

      if (filteredProjects.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }

      filteredProjects.forEach(project => {
        const date = new Date(project.createdAt).toLocaleDateString();
        
        let colorClass = 'text-slate-400';
        let bgClass = 'bg-slate-800/50';
        
        if (project.totalScore >= 85) { colorClass = 'text-emerald-400'; bgClass = 'bg-emerald-500/10 border-emerald-500/30'; }
        else if (project.totalScore >= 70) { colorClass = 'text-primary-400'; bgClass = 'bg-primary-500/10 border-primary-500/30'; }
        else if (project.totalScore >= 55) { colorClass = 'text-accent-400'; bgClass = 'bg-accent-500/10 border-accent-500/30'; }

        const card = document.createElement('div');
        card.className = `glass-card p-6 flex flex-col h-full border fade-up-element ${bgClass}`;
        
        card.innerHTML = `
          <div class="flex justify-between items-start mb-4">
            <span class="text-xs font-medium text-slate-500">${date}</span>
            <div class="flex items-center gap-2">
              <span class="px-2 py-1 rounded text-xs font-bold ${colorClass} bg-dark-900">${project.totalScore}/100</span>
              <button onclick="deleteProject('${project.id}')" class="text-slate-500 hover:text-rose-400 transition-colors">
                <i class="ph ph-trash"></i>
              </button>
            </div>
          </div>
          <h3 class="text-xl font-bold text-white mb-1 truncate" title="${project.name}">${project.name}</h3>
          <p class="text-sm text-slate-400 mb-4 line-clamp-2 flex-grow">${project.oneLineIdea}</p>
          <div class="flex items-center justify-between mt-auto pt-4 border-t border-slate-700/50">
            <span class="text-xs text-slate-500 uppercase tracking-wider">${project.tier}</span>
            <a href="dashboard.html?id=${project.id}" class="text-primary-400 hover:text-primary-300 text-sm font-medium flex items-center gap-1 transition-colors">
              View <i class="ph ph-arrow-right"></i>
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleExport() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allProjects, null, 2));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href",     dataStr);
      downloadAnchorNode.setAttribute("download", "project-validator-backup.json");
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    }

    async function handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(event) {
        try {
          const importedProjects = JSON.parse(event.target.result);
          if (!Array.isArray(importedProjects)) throw new Error("Invalid format");
          
          let count = 0;
          for (const p of importedProjects) {
            if (p.id && p.name) {
              await window.StorageAPI.saveProject(p);
              count++;
            }
          }
          
          window.showToast(`Successfully imported ${count} projects!`, 'success');
          setTimeout(() => window.location.reload(), 1500);
        } catch (err) {
          window.showToast('Error importing file. Invalid format.', 'error');
        }
      };
      reader.readAsText(file);
    }

    window.deleteProject = async (id) => {
      if(confirm('Are you sure you want to delete this project?')) {
        await window.StorageAPI.deleteProject(id);
        allProjects = await window.StorageAPI.getProjects();
        renderProjects();
        window.showToast('Project deleted', 'success');
      }
    };
  </script>
</body>
</html>
