<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Project Validator AI</title>
  <meta name="description" content="Create your free account on Project Validator AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="./assets/css/output.css" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
  <style>
    i[class*="ph"] { display: inline-flex; align-items: center; }
    #googleBtn svg { width: 20px !important; height: 20px !important; flex-shrink: 0; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 16px; pointer-events: none; }
    .input-icon-wrap input { padding-left: 38px; width: 100%; }
    .input-icon-wrap .icon-right { left: auto; right: 12px; pointer-events: all; cursor: pointer; }
    .input-icon-wrap input.has-right { padding-right: 40px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-4 py-8">

  <!-- Background Glows -->
  <div class="fixed top-0 right-1/4 w-[600px] h-[600px] bg-primary-600/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
  <div class="fixed bottom-0 left-1/4 w-96 h-96 bg-accent-500/10 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

  <!-- Logo -->
  <a href="index.html" class="flex items-center gap-2 mb-8">
    <i class="ph ph-rocket-launch" style="font-size:28px; color:#8b5cf6;"></i>
    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">Project Validator AI</span>
  </a>

  <!-- Card -->
  <div class="glass-card p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white">Create your account</h1>
      <p class="text-slate-400 text-sm mt-2">Free forever. No credit card required.</p>
    </div>

    <!-- Success Banner -->
    <div id="successBanner" class="hidden mb-5 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl flex items-center gap-2 text-emerald-400 text-sm">
      <i class="ph ph-check-circle" style="font-size:18px; flex-shrink:0;"></i>
      <span id="successMessage">Account created! Check your email to verify.</span>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden mb-5 p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl flex items-center gap-2 text-rose-400 text-sm">
      <i class="ph ph-warning-circle" style="font-size:18px; flex-shrink:0;"></i>
      <span id="errorMessage">Something went wrong.</span>
    </div>

    <!-- Google OAuth -->
    <button id="googleBtn" type="button"
      class="w-full mb-5 py-3 px-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 hover:border-white/20 transition-all flex items-center justify-center gap-3 text-slate-200 text-sm font-medium relative">
      <svg width="20" height="20" viewBox="0 0 24 24" style="flex-shrink:0;">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>Sign up with Google</span>
      <span id="googleSpinner" class="hidden absolute right-4 top-1/2 -translate-y-1/2">
        <i class="ph ph-spinner animate-spin" style="font-size:18px;"></i>
      </span>
    </button>

    <!-- Divider -->
    <div class="flex items-center gap-4 mb-5">
      <div class="flex-1 h-px bg-white/10"></div>
      <span class="text-slate-500 text-xs whitespace-nowrap">or sign up with email</span>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>

    <!-- Signup Form -->
    <form id="signupForm" class="space-y-4" novalidate>

      <!-- Name -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-2" for="displayName">Your Name</label>
        <div class="input-icon-wrap">
          <i class="ph ph-user icon" style="font-size:16px;"></i>
          <input type="text" id="displayName" autocomplete="name"
            class="input-field" placeholder="Rishvin Reddy"
            style="padding-left:38px; width:100%;">
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-2" for="email">Email address</label>
        <div class="input-icon-wrap">
          <i class="ph ph-envelope icon" style="font-size:16px;"></i>
          <input type="email" id="email" required autocomplete="email"
            class="input-field" placeholder="you@example.com"
            style="padding-left:38px; width:100%;">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-2" for="password">Password</label>
        <div class="input-icon-wrap">
          <i class="ph ph-lock icon" style="font-size:16px;"></i>
          <input type="password" id="password" required autocomplete="new-password"
            class="input-field has-right" placeholder="Min 8 characters"
            style="padding-left:38px; padding-right:40px; width:100%;"
            oninput="checkStrength(this.value)">
          <button type="button" id="togglePassword"
            class="icon icon-right text-slate-500 hover:text-slate-200 transition-colors"
            style="background:none; border:none; padding:0; right:12px;">
            <i class="ph ph-eye" id="eyeIcon" style="font-size:16px;"></i>
          </button>
        </div>
        <!-- Strength bar -->
        <div class="mt-2 h-1 rounded-full bg-dark-800/80 overflow-hidden border border-white/5">
          <div id="strengthBar" class="h-full w-0 rounded-full transition-all duration-300 bg-slate-600"></div>
        </div>
        <p id="strengthLabel" class="text-xs text-slate-600 mt-1 min-h-[16px]"></p>
      </div>

      <!-- Submit -->
      <button type="submit" id="submitBtn"
        class="btn-primary w-full py-3 mt-2 flex items-center justify-center gap-2">
        <i class="ph ph-user-plus" style="font-size:18px;"></i>
        <span id="submitText">Create Free Account</span>
      </button>

    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Already have an account?
      <a href="login.html" class="text-primary-400 hover:text-primary-300 font-medium transition-colors">Sign in</a>
    </p>
  </div>

  <p class="text-slate-600 text-xs mt-8 text-center max-w-sm">
    Your project data is stored securely in Supabase. We never share your information.
  </p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabaseClient.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script>
    function checkStrength(pwd) {
      const bar   = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');
      if (!pwd) { bar.style.width = '0%'; label.textContent = ''; return; }
      let score = 0;
      if (pwd.length >= 8)          score++;
      if (/[A-Z]/.test(pwd))        score++;
      if (/[0-9]/.test(pwd))        score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;
      const levels = [
        { w: '0%',   bg: '#475569', text: '' },
        { w: '25%',  bg: '#ef4444', text: 'Weak' },
        { w: '50%',  bg: '#f59e0b', text: 'Fair' },
        { w: '75%',  bg: '#eab308', text: 'Good' },
        { w: '100%', bg: '#22c55e', text: '✓ Strong' },
      ];
      const lvl = levels[score] || levels[0];
      bar.style.width           = lvl.w;
      bar.style.backgroundColor = lvl.bg;
      label.textContent         = lvl.text;
      label.style.color         = lvl.bg;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try { await window.AuthAPI.redirectIfLoggedIn('saved.html'); } catch {}

      const form        = document.getElementById('signupForm');
      const submitBtn   = document.getElementById('submitBtn');
      const submitText  = document.getElementById('submitText');
      const googleBtn   = document.getElementById('googleBtn');
      const errorBanner = document.getElementById('errorBanner');
      const successBanner = document.getElementById('successBanner');
      const errorMsg    = document.getElementById('errorMessage');
      const togglePwd   = document.getElementById('togglePassword');
      const eyeIcon     = document.getElementById('eyeIcon');
      const pwdInput    = document.getElementById('password');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorBanner.classList.remove('hidden');
        successBanner.classList.add('hidden');
      }
      function showSuccess(msg) {
        document.getElementById('successMessage').textContent = msg;
        successBanner.classList.remove('hidden');
        errorBanner.classList.add('hidden');
      }
      function setLoading(on) {
        submitBtn.disabled = on;
        submitText.textContent = on ? 'Creating account...' : 'Create Free Account';
        const s = submitBtn.querySelector('.spin-icon');
        if (on && !s) {
          const el = document.createElement('i');
          el.className = 'ph ph-spinner animate-spin spin-icon';
          el.style.fontSize = '18px';
          submitBtn.insertBefore(el, submitBtn.firstChild);
        } else if (!on) s?.remove();
      }

      // ── Password Toggle ───────────────────────────────────────────────────
      togglePwd.addEventListener('click', (e) => {
        e.preventDefault();
        const isText = pwdInput.type === 'text';
        pwdInput.type = isText ? 'password' : 'text';
        eyeIcon.className = isText ? 'ph ph-eye' : 'ph ph-eye-slash';
        eyeIcon.style.fontSize = '16px';
      });

      // ── Sign Up Form ──────────────────────────────────────────────────────
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.classList.add('hidden');
        const email = document.getElementById('email').value.trim();
        const pwd   = pwdInput.value;
        const name  = document.getElementById('displayName').value.trim();
        if (!email || !pwd) { showError('Email and password are required.'); return; }
        if (pwd.length < 6) { showError('Password must be at least 6 characters.'); return; }
        setLoading(true);
        try {
          await window.AuthAPI.signUpWithEmail(email, pwd, name);
          showSuccess('Account created! Check your email to verify, then sign in.');
          form.reset();
          checkStrength('');
        } catch (err) {
          const msg = err.message || '';
          if (msg.includes('already registered')) showError('An account with this email already exists. Try signing in.');
          else showError(msg || 'Failed to create account. Try again.');
        } finally {
          setLoading(false);
        }
      });

      // ── Google ────────────────────────────────────────────────────────────
      googleBtn.addEventListener('click', async () => {
        errorBanner.classList.add('hidden');
        document.getElementById('googleSpinner').classList.remove('hidden');
        googleBtn.disabled = true;
        try {
          await window.AuthAPI.signInWithGoogle();
        } catch (err) {
          showError(err.message || 'Google sign up failed.');
          document.getElementById('googleSpinner').classList.add('hidden');
          googleBtn.disabled = false;
        }
      });

    });
  </script>
</body>
</html>
